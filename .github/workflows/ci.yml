# Puerta de calidad. Cada job es independiente y bloqueante; `links` reutiliza el dist/ de `build`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENSPEC_VERSION: 1.14.0
  OPENSPEC_TELEMETRY: '0'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  openspec:
    name: Validar specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}
      - run: openspec validate --all --strict --no-interactive

  build:
    name: Check y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Falla si public/manual-openspec.pdf no corresponde al contenido actual (w14).
      - run: npm run manual:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Instala lychee en el PATH para los tests de fixtures de enlaces.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --version
      - run: npm run test:unit

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).dependencies['@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e

  links:
    name: Enlaces internos
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --root-dir ${{ github.workspace }}/dist dist/
          fail: true
